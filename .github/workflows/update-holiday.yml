name: 更新节假日

on:
  schedule:
    - cron: '0 1 * * *'        # 每天北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成 holiday.ics
        run: python make_holiday.py
      - name: 有变化就提交
        run: |
          # GitHub disables scheduled workflows after 60 days without repo activity: touch a monthly marker
          date -u +%Y-%m > last_check.txt
          git add holiday.ics last_check.txt
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新节假日 $(date -u +%F)"
          git push
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/holiday.ics" || true
