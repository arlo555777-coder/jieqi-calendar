name: 更新节假日和黄历

on:
  schedule:
    - cron: '0 1 * * *'        # 每天北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 生成 holiday.ics（节假日）
        run: python make_holiday.py
      - name: 生成 almanac.ics（黄历：今年 + 明年）
        run: |
          pip install lunar_python==1.4.9
          python make_almanac.py
      - name: 有变化就提交
        run: |
          # GitHub disables scheduled workflows after 60 days without repo activity: touch a monthly marker
          date -u +%Y-%m > last_check.txt
          git add holiday.ics almanac.ics last_check.txt
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "更新节假日 / 黄历 $(date -u +%F)"
          git push
          for f in holiday.ics almanac.ics; do curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || true; done
